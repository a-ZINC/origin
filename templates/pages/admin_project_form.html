{{ template "base.html" . }}
{{ define "title" }}{{ if .IsNew }}new project{{ else }}edit project{{ end }}{{ end }}
{{ define "content" }}
<div class="admin-wrap">
    <div class="admin-header">
        <h1 class="admin-title">{{ if .IsNew }}new project{{ else }}edit project{{ end }}</h1>
        <a href="/admin" class="btn-ghost">← back</a>
    </div>
    <form method="POST"
          action="{{ if .IsNew }}/admin/projects{{ else }}/admin/projects/{{ .Project.ID }}{{ end }}"
          class="simple-form">
        <div class="form-group">
            <label>name</label>
            <input type="text" name="name" value="{{ .Project.Name }}" required>
        </div>
        <div class="form-group">
            <label>description</label>
            <textarea name="description">{{ .Project.Description }}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>live url</label>
                <input type="text" name="url" value="{{ .Project.URL }}">
            </div>
            <div class="form-group">
                <label>repo url</label>
                <input type="text" name="repo_url" value="{{ .Project.RepoURL }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>language</label>
                <input type="text" name="language" value="{{ .Project.Language }}" placeholder="Go">
            </div>
            <div class="form-group">
                <label>stars</label>
                <input type="number" name="stars" value="{{ .Project.Stars }}" min="0">
            </div>
            <div class="form-group">
                <label>sort order</label>
                <input type="number" name="sort_order" value="{{ .Project.SortOrder }}" min="0">
            </div>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="featured" value="true"
                       {{ if .Project.Featured }}checked{{ end }}>
                featured on homepage
            </label>
        </div>
        <button type="submit" class="btn-submit">
            {{ if .IsNew }}create{{ else }}save{{ end }}
        </button>
    </form>
</div>
{{ end }}
